version: '3.8'

services:
  app:
    build: .
    container_name: trackmyhabits_app
    ports:
      - "8080:8080"
    environment:
      - MONGO_URI=mongodb://mongo:27017
      - MONGO_DB=trackdb
      - MONGO_COLLECTION=habits
    depends_on:
      - mongo

  mongo:
    image: mongo:8
    container_name: trackmyhabits_mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data: